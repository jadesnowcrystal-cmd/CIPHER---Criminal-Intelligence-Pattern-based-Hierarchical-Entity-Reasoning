<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCTNS 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --purple-900:#341c5e; --purple-800:#432a72; --purple-700:#5a3a92; --purple-600:#6d47ab;
    --purple-100:#efeafb; --purple-050:#f6f3fd; --lavender:#e3d9f7;
    --pink:#c22a72; --pink-100:#fbe6f0; --blue:#2f8fd1; --blue-100:#e3f2fb;
    --orange:#e98a4e; --orange-100:#fdece0; --green:#3fa66b; --red:#d1495b;
    --ink:#241a38; --muted:#786f92; --line:#e4defa; --bg:#f3f0fb; --card:#ffffff;
    --radius:10px; --shadow:0 1px 2px rgba(52,28,94,.06), 0 4px 14px rgba(52,28,94,.06);
    font-family:'Noto Sans Devanagari','Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{text-decoration:none;color:inherit;}

  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:50;}
  .brand{display:flex;align-items:center;gap:10px;}
  .emblem{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--purple-700),var(--purple-900));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:none;}
  .brand-text .name{font-weight:700;font-size:17px;letter-spacing:.3px;color:var(--purple-900);line-height:1.1;}
  .brand-text .tag{font-size:10.5px;color:var(--muted);}
  .top-right{display:flex;align-items:center;gap:14px;}
  .top-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--purple-700);background:var(--purple-050);border:1px solid var(--line);position:relative;}
  .top-icon svg{width:17px;height:17px;}
  .dot-badge{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff;}
  .login-time{font-size:11.5px;color:var(--muted);white-space:nowrap;}
  .pill-select{border:1px solid var(--line);background:var(--purple-050);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--purple-900);}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--lavender);display:flex;align-items:center;justify-content:center;color:var(--purple-700);font-weight:700;font-size:12px;}
  .lang-toggle{display:flex;border:1px solid var(--purple-700);border-radius:8px;overflow:hidden;}
  .lang-toggle button{border:none;background:#fff;color:var(--purple-700);font-size:12px;font-weight:700;padding:6px 12px;}
  .lang-toggle button.active{background:var(--purple-700);color:#fff;}

  .shell{display:flex;min-height:calc(100vh - 60px);}
  .sidebar{width:230px;flex:none;background:linear-gradient(180deg,var(--purple-900),var(--purple-800) 60%,var(--purple-700));color:#e9e2fb;padding:14px 0;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;}
  .side-search{margin:0 14px 12px;position:relative;}
  .side-search input{width:100%;padding:8px 10px 8px 30px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:12.5px;}
  .side-search input::placeholder{color:#c9bdec;}
  .side-search svg{position:absolute;left:9px;top:9px;width:14px;height:14px;color:#c9bdec;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:13.3px;color:#d9cff2;cursor:pointer;border-left:3px solid transparent;}
  .nav-item svg{width:16px;height:16px;flex:none;}
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:rgba(255,255,255,.13);color:#fff;border-left-color:#f2b84b;font-weight:600;}
  .nav-item .chev{margin-left:auto;width:12px;height:12px;transition:transform .15s;}
  .nav-item.open .chev{transform:rotate(90deg);}
  .submenu{overflow:hidden;max-height:0;transition:max-height .18s ease;}
  .submenu.open{max-height:260px;}
  .submenu a{display:block;padding:8px 16px 8px 42px;font-size:12.5px;color:#c8bced;}
  .submenu a:hover{color:#fff;}
  .submenu a.active{color:#fff;font-weight:600;}

  .main{flex:1;padding:20px 22px 40px;min-width:0;}
  .page{display:none;}
  .page.active{display:block;}
  .page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .page-head h1{font-size:18px;margin:0;color:var(--purple-900);}
  .page-head .crumb{font-size:12px;color:var(--muted);}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
  .stat{border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;border:1px solid var(--line);}
  .stat h3{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:600;}
  .stat .num{font-size:28px;font-weight:700;color:var(--ink);}
  .stat .link{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.6);}
  .stat.c1{background:var(--lavender);} .stat.c1 .link{color:var(--purple-700);}
  .stat.c2{background:#ded3f7;} .stat.c2 .link{color:var(--purple-700);}
  .stat.c3{background:var(--pink-100);} .stat.c3 .link{color:var(--pink);}
  .stat.c4{background:var(--orange-100);} .stat.c4 .link{color:var(--orange);}

  .quicklinks{display:flex;gap:10px;overflow-x:auto;padding:14px;margin-bottom:16px;}
  .qbtn{flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--purple-050);color:var(--purple-800);font-size:12.8px;font-weight:600;white-space:nowrap;}
  .qbtn.primary{background:var(--purple-700);color:#fff;border-color:var(--purple-700);}
  .qbtn svg{width:15px;height:15px;}
  .qbtn:hover{filter:brightness(0.97);}

  .row2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:16px;}
  .card h2{margin:0 0 4px;font-size:14.5px;color:var(--ink);}
  .radiorow{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:8px;}
  .radiorow label{display:flex;align-items:center;gap:5px;cursor:pointer;}
  .donuts{display:flex;justify-content:space-around;gap:10px;}
  .donut-block{text-align:center;}
  .donut-block canvas{max-width:130px;max-height:130px;}
  .donut-block .lbl{font-size:11.5px;color:var(--muted);margin-top:6px;}

  .row2b{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);font-size:11.5px;}
  td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.8px;font-weight:600;}
  .b-investigation{background:#e1f4e9;color:var(--green);}
  .b-evidence{background:#fdeedd;color:#b5701e;}
  .b-search{background:#fde3e6;color:var(--red);}
  .b-forensic{background:var(--blue-100);color:var(--blue);}
  .btn{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--purple-700);}
  .btn.solid{background:var(--purple-700);color:#fff;border-color:var(--purple-700);}
  .btn.ghost{background:transparent;}
  .btn:hover{filter:brightness(0.97);}
  .view-all{float:right;background:var(--purple-700);color:#fff;border:none;padding:5px 12px;border-radius:16px;font-size:11px;font-weight:600;}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-head .month{font-weight:600;font-size:13px;color:var(--purple-900);}
  .cal-nav{background:none;border:none;color:var(--purple-700);font-size:16px;padding:2px 6px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11.5px;}
  .cal-grid .dow{color:var(--muted);font-weight:600;padding:4px 0;}
  .cal-grid .day{padding:7px 0;border-radius:6px;color:var(--ink);}
  .cal-grid .day.today{background:var(--purple-700);color:#fff;font-weight:700;}
  .cal-grid .day.blank{visibility:hidden;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fbfaff;color:var(--ink);}
  .field textarea{resize:vertical;min-height:90px;}
  .field .hint{font-size:10.5px;color:var(--muted);text-align:right;margin-top:3px;}
  .toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13px;color:var(--ink);}
  .toggle{width:36px;height:20px;border-radius:20px;background:var(--line);position:relative;flex:none;transition:.15s;}
  .toggle.on{background:var(--purple-700);}
  .toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.15s;}
  .toggle.on::after{left:18px;}
  .form-actions{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .upload-btn{display:inline-flex;align-items:center;gap:8px;background:var(--purple-700);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:12.5px;font-weight:600;}
  .file-hint{font-size:10.5px;color:var(--muted);margin-top:6px;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  .tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;}
  .tab.active{color:var(--purple-700);border-bottom-color:var(--purple-700);}

  .modcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .modcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
  .modcard h3{margin:0 0 6px;font-size:14px;color:var(--purple-900);}
  .modcard p{margin:0 0 10px;font-size:12.3px;color:var(--muted);line-height:1.5;}
  .modcard ul{margin:0 0 12px;padding-left:16px;font-size:12px;color:var(--ink);}
  .modcard ul li{margin-bottom:3px;}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--purple-900);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:200;}
  .toast.show{opacity:1;transform:translateY(0);}

  .stub{text-align:center;padding:60px 20px;color:var(--muted);}
  .stub svg{width:46px;height:46px;color:var(--purple-600);margin-bottom:12px;}
  .stub h3{color:var(--purple-900);margin:0 0 6px;font-size:15px;}

  .stepper{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  .step-pill{padding:7px 12px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--purple-050);color:var(--muted);border:1px solid var(--line);}
  .step-pill.active{background:var(--purple-700);color:#fff;border-color:var(--purple-700);}
  .step-pill.done{background:#e1f4e9;color:var(--green);border-color:#cdeedb;}
  .step-panel{display:none;}
  .step-panel.active{display:block;}
  .map-box{height:150px;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;background:var(--purple-050);}
  .otp-row{display:flex;gap:8px;align-items:flex-end;}
  .otp-row .field{flex:1;margin-bottom:0;}

  @media (max-width:1000px){
    .grid4{grid-template-columns:repeat(2,1fr);}
    .row2,.row2b{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr 1fr;}
    .modcards{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="emblem">CC</div>
    <div class="brand-text">
      <div class="name">CCTNS <span style="font-weight:400;font-size:12px;color:var(--muted)">2.0</span></div>
      <div class="tag" data-i18n="tagline"></div>
    </div>
  </div>
  <div class="top-right">
    <div class="lang-toggle">
      <button id="btnHi" onclick="setLang('hi')">हिन्दी</button>
      <button id="btnEn" onclick="setLang('en')">English</button>
    </div>
    <span class="login-time" id="loginTime"></span>
    <select class="pill-select" id="stationSelect"></select>
    <select class="pill-select" id="roleSelect"></select>
    <div class="top-icon" data-i18n-title="notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
      <span class="dot-badge"></span>
    </div>
    <div class="top-icon" data-i18n-title="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>
    <div class="avatar">SI</div>
  </div>
</div>

<div class="shell">
  <div class="sidebar">
    <div class="side-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input data-i18n-ph="searchPh">
    </div>

    <div class="nav-item active" data-page="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      <span data-i18n="navDashboard"></span>
    </div>

    <div class="nav-item" data-toggle="gd">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h13a2 2 0 012 2v14l-4-3H4a2 2 0 01-2-2V6a2 2 0 012-2z"/><line x1="6" y1="8" x2="15" y2="8"/><line x1="6" y1="12" x2="13" y2="12"/></svg>
      <span data-i18n="navGD"></span> <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="submenu" id="sub-gd">
      <a data-page="gd-view" class="active" data-i18n="navGDView"></a>
      <a data-page="gd-register" data-i18n="navGDRegister"></a>
      <a data-page="gd-rollcall" data-i18n="navGDRollcall"></a>
    </div>

    <div class="nav-item" data-page="complaints">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.9L2.5 17a2 2 0 001.7 3h15.6a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
      <span data-i18n="navComplaints"></span>
    </div>

    <div class="nav-item" data-page="citizen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      <span data-i18n="navCitizen"></span>
    </div>

    <div class="nav-item" data-toggle="reg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v4h6V3"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>
      <span data-i18n="navReg"></span> <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="submenu" id="sub-reg">
      <a data-page="reg-hub" class="active" data-i18n="navRegHub"></a>
      <a data-page="reg-fir" data-i18n="navRegFir"></a>
      <a data-page="reg-ncr" data-i18n="navRegNcr"></a>
      <a data-page="reg-mlc" data-i18n="navRegMlc"></a>
      <a data-page="reg-missing" data-i18n="navRegMissing"></a>
      <a data-page="reg-property" data-i18n="navRegProperty"></a>
    </div>

    <div class="nav-item" data-page="investigation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span data-i18n="navInvestigation"></span>
    </div>
    <div class="nav-item" data-page="establishment">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
      <span data-i18n="navEstablishment"></span>
    </div>
    <div class="nav-item" data-page="report">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="7" width="3" height="10"/><rect x="17" y="13" width="3" height="4"/></svg>
      <span data-i18n="navReport"></span>
    </div>
    <div class="nav-item" data-page="casebasket">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7h-4V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2H4a1 1 0 00-1 1v10a2 2 0 002 2h14a2 2 0 002-2V8a1 1 0 00-1-1zM10 5h4v2h-4z"/></svg>
      <span data-i18n="navCaseBasket"></span>
    </div>
  </div>

  <div class="main">

    <!-- DASHBOARD -->
    <div class="page active" id="page-dashboard">
      <div class="page-head"><h1 data-i18n="dashTitle"></h1><span class="crumb" data-i18n="crumbDash"></span></div>

      <div class="grid4">
        <div class="stat c1"><h3 data-i18n="statMissing"></h3><div class="num">3</div><a class="link" data-page="reg-missing" data-i18n="viewDetails"></a></div>
        <div class="stat c2"><h3 data-i18n="statUidb"></h3><div class="num">1</div><a class="link" data-page="reg-missing" data-i18n="viewDetails"></a></div>
        <div class="stat c3"><h3 data-i18n="statUifp"></h3><div class="num">0</div><a class="link" data-page="reg-property" data-i18n="viewDetails"></a></div>
        <div class="stat c4"><h3 data-i18n="statPreventive"></h3><div class="num">6</div><a class="link" data-page="report" data-i18n="viewDetails"></a></div>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <h2 data-i18n="quickLinkTitle" style="margin-bottom:10px;"></h2>
        <div class="quicklinks" style="padding:0;margin-bottom:0;">
          <button class="qbtn primary" data-page="gd-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h13a2 2 0 012 2v14l-4-3H4a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg><span data-i18n="qGD"></span></button>
          <button class="qbtn" data-page="reg-fir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg><span data-i18n="qFIR"></span></button>

// CALENDAR
let calDate = new Date(2026,8,1);
function renderCalendar(){
  const y = calDate.getFullYear(), m = calDate.getMonth();
  const monthNames = currentLang==='hi'
    ? ['जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर']
    : ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('calMonthLabel').textContent = monthNames[m] + ' ' + y;
  const first = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();
  const dows = currentLang==='hi' ? ['र','सो','मं','बु','गु','शु','श'] : ['Su','Mo','Tu','We','Th','Fr','Sa'];
  let html = dows.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++) html += `<div class="day blank"></div>`;
  const today = new Date();
  for(let d=1; d<=days; d++){
    const isToday = today.getFullYear()===y && today.getMonth()===m && today.getDate()===d;
    html += `<div class="day${isToday?' today':''}">${d}</div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}
document.getElementById('calPrev').onclick = ()=>{ calDate.setMonth(calDate.getMonth()-1); renderCalendar(); };
document.getElementById('calNext').onclick = ()=>{ calDate.setMonth(calDate.getMonth()+1); renderCalendar(); };

function renderComplaints(){
  document.getElementById('complaintsBody').innerHTML = complaints.map(c=>`
    <tr>
      <td>${c.no}</td>
      <td>${c.dt}</td>
      <td>${c.name}</td>
      <td>${c.sub}</td>
      <td>${c.io}</td>
      <td><span class="badge b-investigation">${t(c.statusKey)}</span></td>
      <td><button class="btn ghost">${t('btnView')}</button></td>
    </tr>
  `).join('');
}

// FIR WIZARD STEPPER
let currentStep = 0;
const totalSteps = 7;

function renderStepper(){
  const stepKeys = ['step1','step2','step3','step4','step5','step6','step7'];
  let html = '';
  for(let i=0; i<totalSteps; i++){
    let cls = 'step-pill';
    if(i === currentStep) cls += ' active';
    else if(i < currentStep) cls += ' done';
    html += `<div class="${cls}">${i+1}. ${t(stepKeys[i])}</div>`;
  }
  document.getElementById('firStepper').innerHTML = html;
  document.getElementById('firPrev').style.display = currentStep === 0 ? 'none' : 'inline-block';
  document.getElementById('firNext').textContent = currentStep === totalSteps - 1 ? t('btnSubmit') : t('btnNext');
}

function firNav(dir){
  if(dir === 1 && currentStep === totalSteps - 1){
    showToast(t('toastFir'));
    currentStep = 0;
    showPage('dashboard');
    return;
  }
  currentStep = Math.max(0, Math.min(totalSteps - 1, currentStep + dir));
  document.querySelectorAll('#page-reg-fir .step-panel').forEach(p=>{
    p.classList.toggle('active', parseInt(p.getAttribute('data-step')) === currentStep);
  });
  renderStepper();
}

function sendOtp(){
  document.getElementById('otpMsg').style.display = 'block';
}

function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 3000);
}

// INITIALIZATION
window.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('loginTime').textContent = new Date().toLocaleString('en-IN', {dateStyle:'medium', timeStyle:'short'});
  setLang('hi');
  initCharts();
});
</script>
